plugins {
    id 'com.android.application'
}

android {
    namespace 'com.edzo.idozito'
    compileSdk 34

    defaultConfig {
        applicationId 'com.edzo.idozito'
        minSdk 24
        // targetSdk 33: robustabb foreground service (elkerüli az Android 14 FGS-típus
        // szigorítását), miközben a háttérfutás és a wake lock így is megbízhatóan megy.
        targetSdk 33
        // A CI a VERSION_CODE env-változóból növekvő értéket ad, hogy az
        // automatikus frissítés (Obtainium/Android) minden buildnél működjön.
        versionCode System.getenv('VERSION_CODE') ? System.getenv('VERSION_CODE').toInteger() : 3
        versionName '6.39'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Fix aláíró kulcs, hogy minden CI-build ugyanazzal az aláírással készüljön,
    // és az Obtainium/Android ütközés nélkül tudjon frissíteni. (Saját használatra
    // szánt kulcs, ismert jelszóval – nem érzékeny titok.)
    signingConfigs {
        stable {
            storeFile file('mytrainer.keystore')
            storePassword 'android'
            keyAlias 'mytrainer'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
    }
}
