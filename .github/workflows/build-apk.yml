name: APK build

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Compute versionCode
        # Minden buildnél növekvő versionCode, hogy az Android frissítésként telepítse.
        run: echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Fetch generated artwork
        # A Higgsfielddel generált látványos háttér- és fejlécképeket a build
        # gépe tölti le (a fejlesztői sandbox nem éri el a CDN-t). Ha egy URL
        # nem elérhető, az app kódból rajzolt gradienssel esik vissza.
        run: |
          mkdir -p app/src/main/res/drawable
          dl() {
            url="$1"; out="app/src/main/res/drawable/$2"
            if curl -fsSL "$url" -o "$out.tmp"; then
              if head -c 4 "$out.tmp" | grep -q "PNG"; then
                mv "$out.tmp" "$out"; echo "OK: $out"
              else
                echo "NEM PNG: $out"; rm -f "$out.tmp"
              fi
            else
              echo "SIKERTELEN letöltés: $url"; rm -f "$out.tmp"
            fi
          }
          dl "https://d8j0ntlcm91z4.cloudfront.net/user_3E8vVcFnmJOikmDhehEJUMZ0uUq/hf_20260716_121951_ae5ec316-944b-4b32-848d-e0d7ef07ca63.png" "bg_main.png"
          dl "https://d8j0ntlcm91z4.cloudfront.net/user_3E8vVcFnmJOikmDhehEJUMZ0uUq/hf_20260716_122006_a68ab320-af8c-4dbb-8ecb-8ca93fcd4343.png" "hero_run.png"
          dl "https://d8j0ntlcm91z4.cloudfront.net/user_3E8vVcFnmJOikmDhehEJUMZ0uUq/hf_20260716_122018_b1f2c5bc-fa99-4724-abb8-5729d52b220f.png" "bg_stats.png"
          dl "https://d8j0ntlcm91z4.cloudfront.net/user_3E8vVcFnmJOikmDhehEJUMZ0uUq/hf_20260716_122900_5d288077-4db1-4065-a241-2849f139d6c9.png" "bg_profile.png"
          dl "https://d8j0ntlcm91z4.cloudfront.net/user_3E8vVcFnmJOikmDhehEJUMZ0uUq/hf_20260719_191837_c7175d08-dd9c-4bae-83b5-2c9cc8ebfd29.png" "bg_mobility.png"
          dl "https://d8j0ntlcm91z4.cloudfront.net/user_3E8vVcFnmJOikmDhehEJUMZ0uUq/hf_20260719_192336_8b7228c2-04b8-46f8-a029-c7076b83e621.png" "bg_library.png"
          dl "https://d8j0ntlcm91z4.cloudfront.net/user_3E8vVcFnmJOikmDhehEJUMZ0uUq/hf_20260719_233006_36e03ce3-20d2-41ff-a0c5-5cf02862f9e0.png" "bg_history.png"
          dl "https://d8j0ntlcm91z4.cloudfront.net/user_3E8vVcFnmJOikmDhehEJUMZ0uUq/hf_20260720_122932_43a534a2-9660-4c48-a653-490d5e43a254.png" "bg_reminders.png"
          dl "https://d8j0ntlcm91z4.cloudfront.net/user_3E8vVcFnmJOikmDhehEJUMZ0uUq/hf_20260720_132016_f591fa65-3e89-455b-b91d-6a4dba66986a.png" "bg_settings.png"
          dl "https://d8j0ntlcm91z4.cloudfront.net/user_3E8vVcFnmJOikmDhehEJUMZ0uUq/hf_20260720_142758_ecbd1582-903e-4027-b997-dfa802a8f6a6.png" "bg_workout.png"
          dl "https://d8j0ntlcm91z4.cloudfront.net/user_3E8vVcFnmJOikmDhehEJUMZ0uUq/hf_20260720_144953_b7dc325b-ebe5-4cb2-9b8a-7791b76dc6fc.png" "bg_main2.png"
          dl "https://d8j0ntlcm91z4.cloudfront.net/user_3E8vVcFnmJOikmDhehEJUMZ0uUq/hf_20260720_145129_871d9e58-1399-458c-8eb3-318503d06b81.png" "bg_main3.png"
          dl "https://d8j0ntlcm91z4.cloudfront.net/user_3E8vVcFnmJOikmDhehEJUMZ0uUq/hf_20260722_175618_5f6d28b3-6f30-4594-a795-4e503335ddf8.png" "bg_main4.png"
          # PNG → WebP a jóval kisebb APK-ért (a háttérképek nagyok). Ha a cwebp
          # nem elérhető vagy hibázik, marad a PNG – így a build sosem törik el.
          if ! command -v cwebp >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq webp || true; fi
          for f in app/src/main/res/drawable/*.png; do
            [ -e "$f" ] || continue
            if cwebp -quiet -q 80 "$f" -o "${f%.png}.webp"; then rm -f "$f"; echo "WebP: ${f%.png}.webp"; else echo "cwebp hiba, marad PNG: $f"; fi
          done
          ls -la app/src/main/res/drawable/ || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/My-Trainer.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Trainer-apk
          path: out/My-Trainer.apk
          if-no-files-found: error

      - name: Publish APK to Release
        if: >-
          github.ref == 'refs/heads/claude/busy-cori-yjd6to' ||
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          # Egyedi tag minden buildnél, hogy az Obtainium új verzióként lássa.
          # A GitHub "latest release" mindig a legújabbra mutat, így a fix
          # .../releases/latest link is működik.
          tag_name: build-${{ github.run_number }}
          name: "Grit – build ${{ github.run_number }}"
          make_latest: true
          body: |
            Grit automatikus build (v12.5, build ${{ github.run_number }}).

            Obtainiummal magától frissül. Kézi telepítéshez töltsd le a
            **My-Trainer.apk** fájlt, és engedélyezd az „ismeretlen forrásból"
            való telepítést.
          files: out/My-Trainer.apk
