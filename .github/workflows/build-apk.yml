name: APK build

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Compute versionCode
        # Minden buildnél növekvő versionCode, hogy az Android frissítésként telepítse.
        run: echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/My-Trainer.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Trainer-apk
          path: out/My-Trainer.apk
          if-no-files-found: error

      - name: Publish APK to Release
        if: >-
          github.ref == 'refs/heads/claude/busy-cori-yjd6to' ||
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          # Egyedi tag minden buildnél, hogy az Obtainium új verzióként lássa.
          # A GitHub "latest release" mindig a legújabbra mutat, így a fix
          # .../releases/latest link is működik.
          tag_name: build-${{ github.run_number }}
          name: "My trainer – build ${{ github.run_number }}"
          make_latest: true
          body: |
            My trainer automatikus build (v2.2, build ${{ github.run_number }}).

            Obtainiummal magától frissül. Kézi telepítéshez töltsd le a
            **My-Trainer.apk** fájlt, és engedélyezd az „ismeretlen forrásból"
            való telepítést.
          files: out/My-Trainer.apk
